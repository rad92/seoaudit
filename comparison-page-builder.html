<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Comparison Page Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar; left rail = section index with completion state; main = one form card per framework section; Preview and Checklist are alternate views of the same brief. */
:root{
  --bg:#F3F5F8; --panel:#FFFFFF; --sunk:#EBEEF3; --ink:#152030; --ink-2:#4A5668; --ink-3:#7A8496;
  --line:#D8DEE7; --line-2:#C3CBD7;
  --accent:#2350C8; --accent-ink:#FFFFFF; --accent-soft:#E4EBFB;
  --comp:#6B5A3E; --comp-soft:#F3EEE5;
  --ok:#1D7A4B; --ok-soft:#E1F2E8; --warn:#9A6200; --warn-soft:#FBF0DA; --miss:#B23A2E; --miss-soft:#FBE7E4;
  --input:#FFFFFF; --focus:#2350C8;
  --f-ui:"Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-read:"Newsreader", Georgia, "Times New Roman", serif;
  --f-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141C; --panel:#161D28; --sunk:#1C2431; --ink:#E6EBF2; --ink-2:#AEB8C7; --ink-3:#7E8899;
  --line:#2A3443; --line-2:#3A4556;
  --accent:#7EA0F5; --accent-ink:#0F141C; --accent-soft:#1F2C4A;
  --comp:#D2BB92; --comp-soft:#2A2519;
  --ok:#5FC991; --ok-soft:#16302A; --warn:#E5B35A; --warn-soft:#33291A; --miss:#F08A7E; --miss-soft:#3A1F1C;
  --input:#111821; --focus:#7EA0F5; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F141C; --panel:#161D28; --sunk:#1C2431; --ink:#E6EBF2; --ink-2:#AEB8C7; --ink-3:#7E8899;
  --line:#2A3443; --line-2:#3A4556;
  --accent:#7EA0F5; --accent-ink:#0F141C; --accent-soft:#1F2C4A;
  --comp:#D2BB92; --comp-soft:#2A2519;
  --ok:#5FC991; --ok-soft:#16302A; --warn:#E5B35A; --warn-soft:#33291A; --miss:#F08A7E; --miss-soft:#3A1F1C;
  --input:#111821; --focus:#7EA0F5; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:15px;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--ink-3)}
.brief-pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brief-pick label{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
select,input[type=text],input[type=url],input[type=date],input[type=number],textarea{background:var(--input);border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px;line-height:1.5}
select{width:auto}
.tabs{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:8px;margin-left:auto}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-weight:500}
.tabs button[aria-selected=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{border:1px solid var(--line-2);background:var(--panel);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.small{padding:3px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.status{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.status.saved i{background:var(--ok)} .status.saving i{background:var(--warn)} .status.local i{background:var(--warn)} .status.error i{background:var(--miss)}

.banner{max-width:1320px;margin:12px auto 0;padding:0 16px}
.banner div{background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;font-size:13px}

/* shell */
.shell{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:16px 64px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);align-self:start;max-height:calc(100vh - 100px);overflow:auto}
.progress{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.progress .num{font-size:22px;font-weight:600}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:var(--accent)}
.toc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.toc a{display:grid;grid-template-columns:28px 1fr auto;gap:6px;align-items:center;padding:6px 8px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-size:13px}
.toc a:hover{background:var(--panel);color:var(--ink)}
.toc .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line-2)}
.dot.part{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.dot.done{border-color:var(--ok);background:var(--ok)}
.toc .opt{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}

/* section cards */
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.intro{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.intro h1{font-size:20px;margin:0 0 4px;text-wrap:balance}
.intro p{margin:0;color:var(--ink-2);max-width:72ch}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);scroll-margin-top:90px}
.card-h{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px 12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h .no{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);padding-top:3px;min-width:34px}
.card-h .ttl{flex:1;min-width:0}
.card-h h2{font-size:16px;margin:0;text-wrap:balance}
.card-h .h2as{font-family:var(--f-mono);font-size:12px;color:var(--accent);margin-top:2px;overflow-wrap:anywhere}
.chip{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-3);white-space:nowrap}
.chip.req{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.chip.st-done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.st-part{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.card-b{padding:14px 18px 18px;display:flex;flex-direction:column;gap:14px}
.purpose{margin:0;color:var(--ink-2);max-width:80ch}
details.notes{background:var(--sunk);border-radius:6px;padding:8px 12px;font-size:13px;color:var(--ink-2)}
details.notes summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.notes ul{margin:6px 0 0;padding-left:18px}
details.notes li{margin:2px 0}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
.field>label,.field .lbl{font-weight:600;font-size:13px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.field .req-star{color:var(--miss)}
.help{font-size:12px;color:var(--ink-3)}
.meter{font-size:11.5px;font-family:var(--f-mono);color:var(--ink-3)}
.meter.ok{color:var(--ok)} .meter.warn{color:var(--warn)} .meter.bad{color:var(--miss)}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.side{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.side h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.side.up h3{color:var(--accent)} .side.comp h3{color:var(--comp)}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;gap:6px;align-items:center}
.li .bul{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);width:18px;text-align:right;flex:none}
.x{border:0;background:transparent;color:var(--ink-3);cursor:pointer;border-radius:4px;padding:2px 6px;font-size:14px;line-height:1}
.x:hover{background:var(--miss-soft);color:var(--miss)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table.grid{border-collapse:collapse;width:100%;min-width:640px}
table.grid th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;text-align:left;color:var(--ink-3);background:var(--sunk);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.grid th.up{color:var(--accent)} table.grid th.comp{color:var(--comp)}
table.grid td{border-bottom:1px solid var(--line);padding:4px;vertical-align:top}
table.grid tr:last-child td{border-bottom:0}
table.grid td.lab{font-weight:600;font-size:13px;padding:9px 8px;white-space:nowrap}
table.grid input,table.grid select,table.grid textarea{border-color:transparent;background:transparent;padding:5px 6px}
table.grid input:hover,table.grid textarea:hover{border-color:var(--line)}
table.grid input:focus,table.grid select:focus,table.grid textarea:focus{border-color:var(--focus);background:var(--input)}
table.grid textarea{min-height:34px}
.cat{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.cat-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 12px;background:var(--sunk)}
.cat-h b{flex:1;min-width:0}
.cat-b{padding:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.pair{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px}
.pair-h{display:flex;gap:8px;align-items:center}
.pair-h .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);flex:none}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.toggle{display:flex;gap:8px;align-items:center;font-weight:600}

/* preview */
.pv{display:flex;flex-direction:column;gap:16px;min-width:0}
.serp{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.serp .lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:8px;display:flex;gap:12px;flex-wrap:wrap}
.serp .crumb{font-size:12.5px;color:var(--ink-2)}
.serp .t{font-size:19px;color:var(--accent);margin:2px 0;line-height:1.3;overflow-wrap:anywhere}
.serp .d{font-size:13.5px;color:var(--ink-2);max-width:62ch}
article.doc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:28px clamp(16px,4vw,48px);font-family:var(--f-read);font-size:17px;line-height:1.65}
article.doc>*{max-width:68ch}
article.doc h1{font-size:30px;line-height:1.2;margin:0 0 8px;font-weight:600;text-wrap:balance}
article.doc h2{font-size:23px;margin:32px 0 8px;font-weight:600;text-wrap:balance}
article.doc h3{font-size:18.5px;margin:20px 0 6px;font-weight:600}
article.doc p{margin:8px 0}
article.doc .byline{font-family:var(--f-ui);font-size:13px;color:var(--ink-3)}
article.doc .verified{font-family:var(--f-ui);font-size:13px;background:var(--sunk);padding:6px 10px;border-radius:6px;display:inline-block}
article.doc .tw{max-width:none;overflow-x:auto;margin:12px 0}
article.doc table{border-collapse:collapse;font-family:var(--f-ui);font-size:14px;min-width:520px;width:100%}
article.doc th,article.doc td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
article.doc th{background:var(--sunk)}
article.doc mark.miss{background:var(--miss-soft);color:var(--miss);font-family:var(--f-ui);font-size:13px;padding:1px 6px;border-radius:4px}
article.doc .wcnt{font-family:var(--f-ui);font-size:12px;color:var(--ink-3)}

/* checklist */
.ck{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.ck h2{font-size:16px;margin:0;padding:14px 18px;border-bottom:1px solid var(--line)}
.ck ul{list-style:none;margin:0;padding:6px 0}
.ck li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:8px 18px;align-items:start}
.ck li .why{font-size:12px;color:var(--ink-3)}
.ck .ico{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.ck .ico.ok{background:var(--ok-soft);color:var(--ok)} .ck .ico.no{background:var(--miss-soft);color:var(--miss)}
.ck input[type=checkbox]{width:16px;height:16px;margin:2px 0 0;accent-color:var(--accent)}

/* export sheet */
.sheet{position:fixed;inset:0;background:rgba(10,14,20,.45);display:grid;place-items:center;padding:16px;z-index:50}
.sheet>div{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:820px;width:100%;max-height:86vh;display:flex;flex-direction:column}
.sheet header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet header b{flex:1}
.sheet textarea{border:0;border-radius:0;flex:1;min-height:50vh;font-family:var(--f-mono);font-size:12.5px;padding:14px 16px;background:var(--input)}
.newb{display:flex;gap:6px;align-items:center}
.sheet header{flex-wrap:wrap}
.gaps{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-2)}
.sheet .hint{font-size:12px;color:var(--ink-3);padding:8px 16px 0}
.newb input{width:160px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:60}

@media (max-width:960px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none}
  .toc{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .toc a{grid-template-columns:auto auto;white-space:nowrap;background:var(--panel);border:1px solid var(--line)}
  .toc a .t,.toc .opt{display:none}
  .tabs{margin-left:0}
}
@media (max-width:640px){
  .fields,.split,.cat-b{grid-template-columns:minmax(0,1fr)}
  .top{position:static}
  .top-in{gap:8px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>Comparison Page Builder</b><span>UpKeep vs. competitor pages</span></div>
    <div class="brief-pick">
      <label for="briefSel">Brief</label>
      <select id="briefSel" aria-label="Choose a comparison brief"></select>
      <span class="newb" id="newWrap" hidden>
        <input type="text" id="newName" placeholder="Competitor, e.g. Limble" aria-label="New competitor name">
        <button class="btn small primary" id="newGo">Create</button>
        <button class="btn small ghost" id="newCancel">Cancel</button>
      </span>
      <button class="btn small" id="newBtn">+ New brief</button>
    </div>
    <div class="status" id="status" role="status"><i></i><span>Loading…</span></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-edit" aria-selected="true" data-view="edit">Edit</button>
      <button role="tab" id="tab-preview" aria-selected="false" data-view="preview">Preview</button>
      <button role="tab" id="tab-check" aria-selected="false" data-view="check">Checklist</button>
    </div>
    <button class="btn" id="exportBtn">Export</button>
  </div>
</header>
<div class="banner" id="banner" hidden><div id="bannerText"></div></div>

<div class="shell">
  <aside class="rail" aria-label="Sections">
    <div class="progress">
      <div class="help">Required sections complete</div>
      <div><span class="num mono" id="pNum">0/0</span></div>
      <div class="bar"><span id="pBar" style="width:0%"></span></div>
    </div>
    <ul class="toc" id="toc"></ul>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="sheet" id="sheet" hidden>
  <div role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header>
      <b id="sheetTitle">Export</b>
      <button class="btn small" id="fmtMd">Markdown</button>
      <button class="btn small" id="fmtHtml">HTML snippet</button>
      <button class="btn small" id="fmtDoc">HTML document</button>
      <label class="gaps" id="gapsWrap" hidden><input type="checkbox" id="gapsChk"> Show missing items</label>
      <button class="btn small primary" id="copyBtn">Copy</button>
      <button class="btn small" id="dlBtn" hidden>Download</button>
      <button class="btn small ghost" id="closeSheet" aria-label="Close export">Close</button>
    </header>
    <p class="hint" id="sheetHint"></p>
    <textarea id="sheetText" readonly aria-label="Exported page draft"></textarea>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const words=s=>{s=String(s||"").trim();return s?s.split(/\s+/).length:0};
const filled=v=>String(v==null?"":v).trim()!=="";
const clone=o=>JSON.parse(JSON.stringify(o));
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60)||"brief";
function getP(o,p){return p.split(".").reduce((a,k)=>a==null?undefined:a[k],o)}
function setP(o,p,v){const ks=p.split(".");let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null)a[ks[i]]=/^\d+$/.test(ks[i+1])?[]:{};a=a[ks[i]]}a[ks[ks.length-1]]=v}
/* sessionStorage: kept across a refresh, cleared when the tab or browser closes, so every new visit starts from the defaults */
const ls={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2200)}

/* ---------- the brief template ---------- */
const YEAR=String(new Date().getFullYear());
const GLANCE=[
 ["Best for","multi-site teams that need PM depth, safety and fleet in one tool","small teams that want a free plan and simple mobile work orders"],
 ["Starting price","$[X]/user/month, billed annually","$[X]/user/month, billed annually"],
 ["Free plan / trial","No free plan; [X]-day free trial","Free plan for up to [X] users"],
 ["G2 rating","[X.X] ([count] reviews)","[X.X] ([count] reviews)"],
 ["Standout strengths","2–3 items","2–3 items"],
 ["Main limitations","1–2 honest items, e.g. no free plan","1–2 items"],
 ["Mobile apps","iOS, Android; offline on [plan]","iOS, Android; offline on [plan]"],
 ["Gated to higher plans","e.g. offline mode: Professional","e.g. meter-based PM: Premium"]
];
const FEATURES=[
 ["AI","AI assistant for work orders, assets and insights","Yes — Nova, included on every plan"],
 ["AI","Autonomous AI agents for multi-step tasks","Yes — Supernova"],
 ["AI","AI data audits and anomaly detection","Yes — Nova Intelligence"],
 ["Work orders & PM","Dedicated preventive maintenance module","Yes — condition-based triggers, AI checklists"],
 ["Work orders & PM","Meter- and sensor-based PM triggers",""],
 ["Work orders & PM","Custom work order statuses","Yes"],
 ["Work orders & PM","Bulk actions for work orders, assets and schedules","Yes"],
 ["Assets","Asset hierarchy depth","4 levels"],
 ["Assets","Asset lifecycle and depreciation",""],
 ["Parts & inventory","Parts and inventory tracking",""],
 ["Parts & inventory","Purchase orders",""],
 ["Reporting","Custom reports and dashboards","Yes — Looker-powered"],
 ["Reporting","Asset-level reporting (MTBF, MTTR, downtime)","Yes"],
 ["Reporting","PDF / CSV export on every plan","Yes"],
 ["Mobile","iOS and Android apps",""],
 ["Mobile","Offline mode",""],

function fieldDone(f){
  const v=getP(brief,f.k);
  switch(f.type){
    case "list":{const n=(v||[]).filter(filled).length;return n>=(f.min||1)}
    case "table":{const rc=f.reqCols||[];const n=(v||[]).filter(r=>rc.every(c=>filled(r[c]))).length;return n>=(f.min||1)}
    case "fixedtable":{const rows=f.reqRows?(v||[]).slice(0,f.reqRows):(v||[]);const rc=f.reqCols||f.cols.map(c=>c.k);return rows.length>0&&rows.every(r=>rc.every(c=>filled(r[c])))}
    case "pairs":return (v||[]).filter(p=>filled(p.q)&&filled(p.a)).length>=(f.min||1);
    case "cats":return (v||[]).every(c=>filled(c.comp)&&filled(c.up)&&filled(c.diff));
    case "split":return ["comp","up"].every(s=>filled(v[s].what)&&v[s].strengths.filter(filled).length>=3&&v[s].limits.filter(filled).length>=2);
    case "check":return true;
    default:
      if(f.w)return words(v)>=f.w[0];
      if(f.chars)return String(v||"").length>=f.chars[0];
      return filled(v);
  }
}
function fieldStarted(f){

  if(Array.isArray(v))return v.some(x=>typeof x==="object"?Object.entries(x).some(([k,y])=>!["label","src","cat","name","group","cap","q","plan"].includes(k)&&filled(y)):filled(x));
  if(v&&typeof v==="object")return JSON.stringify(v).replace(/"[^"]*":/g,"").replace(/[\[\]{}",]/g,"").trim()!=="";
  return filled(v);
}
function secState(s){
  const req=s.fields.filter(f=>f.req);
  if(!req.length){const fs=s.fields.filter(f=>f.type!=="check"&&!f.pre);const n=fs.filter(fieldStarted).length;return n===0?"empty":n===fs.length?"done":"part"}
  const done=req.filter(fieldDone).length;
  if(done===req.length)return "done";
  return (done>0||s.fields.some(fieldStarted))?"part":"empty";
}

  if(f.chars){const n=String(v||"").length;const[a,b]=f.chars;return{cls:n===0?"":(n>=a&&n<=b)?"ok":n>b?"bad":"warn",t:`${n} characters · target ${a}–${b}`}}

  if(f.check==="fresh"&&v){const d=Math.floor((Date.now()-new Date(v+"T00:00:00").getTime())/864e5);return{cls:d<=90?"ok":"bad",t:d<0?"date is in the future":`${d} days ago · re-check after 90`}}

}

function listOr(arr,label){const f=(arr||[]).filter(filled);return f.length?f:[MISS+label+MISS]}
function inlineHTML(t,preview){
  let h=esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  h=h.replace(new RegExp(MISS+"([^"+MISS+"]*)"+MISS,"g"),(m,l)=>preview?`<mark class="miss">Add: ${l}</mark>`:`[ADD: ${l}]`);
  return h;
}
function inlineMD(t){return String(t).replace(new RegExp(MISS+"([^"+MISS+"]*)"+MISS,"g"),"[ADD: $1]")}
function toHTML(bs,preview){
  return bs.map(b=>{const I=x=>inlineHTML(x,preview);
    switch(b.t){
      case "h1":return `<h1>${I(b.x)}</h1>`;case "h2":return `<h2>${I(b.x)}</h2>`;case "h3":return `<h3>${I(b.x)}</h3>`;
      case "byline":return `<p class="byline">${I(b.x)}</p>`;case "verified":return `<p class="verified">${I(b.x)}</p>`;
      case "p":return `<p>${I(b.x).replace(/\n/g,"<br>")}</p>`;case "quote":return `<blockquote><p>${I(b.x)}</p></blockquote>`;
      case "img":return `<p>${preview?`<mark class="miss">Screenshot</mark> `:""}<em>[Image: ${esc(b.x)}]</em></p>`;
      case "ul":return `<ul>${b.i.map(x=>`<li>${I(x)}</li>`).join("")}</ul>`;case "ol":return `<ol>${b.i.map(x=>`<li>${I(x)}</li>`).join("")}</ol>`;
      case "table":return `<div class="tw"><table><thead><tr>${b.h.map(x=>`<th>${I(x)}</th>`).join("")}</tr></thead><tbody>${b.r.map(r=>`<tr>${r.map(x=>`<td>${I(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    }return ""}).join("\n");
}
function toMD(bs){
  const cell=x=>inlineMD(x).replace(/\|/g,"\\|").replace(/\n/g," ");
  return bs.map(b=>{const I=inlineMD;
    switch(b.t){
      case "h1":return "# "+I(b.x);case "h2":return "## "+I(b.x);case "h3":return "### "+I(b.x);
      case "byline":case "verified":return "_"+I(b.x)+"_";case "p":return I(b.x);case "quote":return "> "+I(b.x);
      case "img":return `![${b.x}](screenshot.png)`;
      case "ul":return b.i.map(x=>"- "+I(x)).join("\n");case "ol":return b.i.map((x,i)=>`${i+1}. ${I(x)}`).join("\n");
      case "table":return `| ${b.h.map(cell).join(" | ")} |\n| ${b.h.map(()=>"---").join(" | ")} |\n`+b.r.map(r=>`| ${r.map(cell).join(" | ")} |`).join("\n");
    }return ""}).join("\n\n");
}

function autoChecks(){
  const s=brief.settings,out=[];
  out.push(["Named author and author role",filled(s.author)&&filled(s.authorRole),""]);
  const ow=words(brief.opening.answer);out.push(["Opening short answer is 50–80 words",ow>=50&&ow<=80,`${ow} words`]);

  const fr=brief.features.filter(r=>filled(r.cap)&&filled(r.up)&&filled(r.comp)).length;out.push(["Feature table has 25+ complete rows",fr>=25,`${fr} complete rows`]);
  const cw=brief.features.filter(r=>r.win==="comp"||r.win==="tie").length;out.push([`${C()} wins or ties at least 3 feature rows`,cw>=3,`${cw} rows`]);
  out.push(["Both pricing tables have prices",brief.pricing.up.some(r=>filled(r.annual))&&brief.pricing.comp.some(r=>filled(r.annual)),""]);
  const g=brief.ratings.rows[0];out.push(["Ratings have review counts and a checked-on date (at least G2)",[g.up,g.upN,g.comp,g.compN,g.checked].every(filled),""]);
  const fa=brief.faq.filter(p=>filled(p.q)&&filled(p.a)).length;out.push(["9+ FAQs answered",fa>=9,`${fa} answered`]);

}

/* ---------- persistence ---------- */
function setStatus(kind,text){const el=$("#status");el.className="status "+kind;el.querySelector("span").textContent=text}
function banner(t){$("#banner").hidden=!t;$("#bannerText").textContent=t||""}
function scheduleSave(){dirty=true;setStatus("saving","Unsaved changes");clearTimeout(saveTimer);saveTimer=setTimeout(save,900)}
async function save(){
  if(saving){await saving;}
  if(!dirty)return;
  dirty=false;
  const body=clone(brief);body.updatedAt=new Date().toISOString();
  if(store.kind==="db"&&store.canWrite){
    setStatus("saving","Saving…");
    saving=store.db.collection("briefs").doc(briefId).set(body).then(()=>{saved=true;list[briefId]={competitor:brief.competitor,updatedAt:body.updatedAt};fillPicker();setStatus("saved","Saved · shared")})
      .catch(e=>{dirty=true;if(e&&e.code==="invalid_argument"){store.canWrite=false;setStatus("error","Read-only");banner("You can view this brief but not change it. Ask the owner for Contributor access to edit.");render()}else if(e&&e.code==="quota_exceeded"){setStatus("error","Storage full");banner("This builder's storage is full. Delete old briefs to save new ones.")}else{setStatus("error","Not saved, will retry");setTimeout(save,4000)}})
      .finally(()=>{saving=null});
    await saving;
  }else{
    const all=JSON.parse(ls.get("cpb:local")||"{}");all[briefId]=body;ls.set("cpb:local",JSON.stringify(all));
    list[briefId]={competitor:brief.competitor,updatedAt:body.updatedAt};fillPicker();setStatus("local","Kept until you close this tab");
  }
}
function fillPicker(){
  const ids=Object.keys(list);if(!ids.includes(briefId))ids.push(briefId);
  ids.sort((a,b)=>String((list[a]||{}).competitor||a).localeCompare(String((list[b]||{}).competitor||b)));
  $("#briefSel").innerHTML=ids.map(id=>`<option value="${esc(id)}" ${id===briefId?"selected":""}>${esc((list[id]||{}).competitor||(id===briefId?brief.competitor:id))}${(list[id]||saved&&id===briefId)?"":" (not saved yet)"}</option>`).join("");
}
async function openBrief(id){
  if(dirty)await save();
  briefId=id;ls.set("cpb:last",id);
  if(store.kind==="db"){const snap=await store.db.collection("briefs").doc(id).get();saved=snap.exists;brief=normalize(snap.exists?snap.data():blank(id))}
  else{const all=JSON.parse(ls.get("cpb:local")||"{}");saved=!!all[id];brief=normalize(all[id]||blank(id))}
  fillPicker();render();
}
async function createBrief(name){
  name=String(name||"").trim();if(!name)return;
  const id=slug(name);
  if(list[id]){openBrief(id);return}
  if(dirty)await save();
  briefId=id;brief=normalize(blank(name));saved=false;ls.set("cpb:last",id);
  dirty=true;await save();render();toast(`Created the ${name} brief`);
}

/* ---------- events ---------- */
document.addEventListener("input",e=>{
  const el=e.target;const p=el.dataset&&el.dataset.path;if(!p||!store.canWrite)return;
  const val=el.type==="checkbox"?el.checked:el.value;setP(brief,p,val);
  if(p==="competitor"||p==="year"){scheduleSave();return}
  const m=document.querySelector(`[data-meter="${CSS.escape(p)}"]`);
  if(m){const f=findField(p);const mm=f?meterFor(f,val):meterFor({w:[40,70]},val);const tn=f&&f.check==="title"?titleNote(val):"";m.className="meter "+(mm?mm.cls:"");m.textContent=(mm?mm.t:"")+(tn?" · "+tn:"")}
  const card=el.closest(".card");if(card)updateChips(card);
  renderToc();scheduleSave();
});
document.addEventListener("change",e=>{
  const el=e.target;const p=el.dataset&&el.dataset.path;if(!p)return;
  if(p==="competitor"||p==="year"){if(view==="edit"){const y=window.scrollY;renderEdit();window.scrollTo(0,y)}renderToc();fillPicker()}
  /* list, table and pair counters depend on several cells: refresh the card once the value is committed */
  if(view==="edit"&&/\.\d+(\.|$)/.test(p)){const card=el.closest(".card");if(card)refreshList(card)}
  if(view==="check")renderCheck();
});
function refreshList(card){
  const sec=card.dataset.sec;
  setTimeout(()=>{const a=document.activeElement&&document.activeElement.id;refreshCard(sec);if(a){const n=document.getElementById(a);if(n)n.focus()}},0);
}
function findField(p){for(const s of SECTIONS)for(const f of s.fields){if(f.k===p)return f;if(f.type==="split"){const m=p.match(/^about\.(comp|up)\.what$/);if(m)return{w:[60,100]}}}
  if(/^breakdown\.\d+\.(comp|up)$/.test(p))return{w:[40,60]};if(/^breakdown\.\d+\.diff$/.test(p))return{w:[10,45]};if(/^faq\.\d+\.a$/.test(p))return{w:[40,70]};return null}
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,a");if(!t)return;
  if(t.dataset.view){setView(t.dataset.view);return}
  if(t.dataset.goto){e.preventDefault();if(view!=="edit")setView("edit");const el=document.getElementById("sec-"+t.dataset.goto);if(el)el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});return}
  if(t.dataset.act&&store.canWrite){
    const arr=getP(brief,t.dataset.arr);const card=t.closest(".card");
    if(t.dataset.act==="add"){const f=findArrField(t.dataset.arr);arr.push(f&&f.newRow?clone(f.newRow):t.dataset.arr==="faq"?{q:"",a:""}:"")}
    else arr.splice(+t.dataset.i,1);
    refreshCard(card.dataset.sec);renderToc();scheduleSave();
    if(t.dataset.act==="add"){const c=document.getElementById("sec-"+card.dataset.sec);const ins=c.querySelectorAll(`[data-path^="${t.dataset.arr}."]`);if(ins.length)ins[ins.length-1].focus()}
    return;
  }
  if(t.dataset.cmt&&comments){const card=document.getElementById("sec-"+t.dataset.cmt);try{await comments.openComposer({element:card})}catch(err){t.hidden=true;toast("Commenting isn't available here. Use the comment tool in the viewer instead.")}return}
});
function findArrField(k){for(const s of SECTIONS)for(const f of s.fields)if(f.k===k)return f;return null}
$("#briefSel").addEventListener("change",e=>openBrief(e.target.value));
$("#newBtn").addEventListener("click",()=>{$("#newWrap").hidden=false;$("#newBtn").hidden=true;$("#newName").focus()});
$("#newCancel").addEventListener("click",()=>{$("#newWrap").hidden=true;$("#newBtn").hidden=false});
$("#newGo").addEventListener("click",()=>{createBrief($("#newName").value);$("#newName").value="";$("#newWrap").hidden=true;$("#newBtn").hidden=false});
$("#newName").addEventListener("keydown",e=>{if(e.key==="Enter")$("#newGo").click();if(e.key==="Escape")$("#newCancel").click()});

/* export */
/* full, styled, standalone HTML document of what has been filled in */
function pruneBlocks(bs){
  const strip=x=>String(x).replace(new RegExp(MISS+"[^"+MISS+"]*"+MISS,"g"),"").trim();
  const emptyText=x=>strip(x).replace(/\*\*[^*]*\*\*/g,"").replace(/[\s.:,·—-]+/g,"")==="";
  const out=[];
  for(const b of bs){
    if(b.t==="ul"||b.t==="ol"){const i=b.i.map(strip).filter(Boolean);
      if(!i.length){const prev=out[out.length-1];if(prev&&prev.t==="p"&&/^\*\*[^*]+\*\*$/.test(prev.x.trim()))out.pop();continue}
      out.push({...b,i});continue}
    if(b.t==="table"){const r=b.r.map(row=>row.map(strip)).filter(row=>row.slice(1).some(Boolean));if(r.length)out.push({...b,r});continue}
    if(b.t==="h1"||b.t==="h2"||b.t==="h3"){out.push({...b,x:strip(b.x)});continue}
    if(b.label){out.push(b);continue}
    if(emptyText(b.x))continue;
    out.push({...b,x:strip(b.x).replace(/\s+([.,])/g,"$1")});
  }
  /* drop headings left with nothing under them: empty H3s first, then empty H2s */
  const dropEmpty=(arr,lvl,stop)=>arr.filter((b,i)=>{if(b.t!==lvl)return true;const nxt=arr.slice(i+1);const j=nxt.findIndex(x=>stop.includes(x.t));return (j===-1?nxt:nxt.slice(0,j)).length>0});
  const res=dropEmpty(dropEmpty(out,"h3",["h1","h2","h3"]),"h2",["h1","h2"]);
  return res;
}
function docHTML(gaps){
  const bs=gaps?blocks():pruneBlocks(blocks());
  const s=brief.settings;
  const title=esc(filled(s.title)?s.title:sub("{C} vs UpKeep ({Y})"));
  const meta=filled(s.metaDesc)?`<meta name="description" content="${esc(s.metaDesc)}">\n`:"";
  const today=new Date().toISOString().slice(0,10);
  return `<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${title}</title>
${meta}<style>
:root{--ink:#152030;--ink-2:#4A5668;--ink-3:#7A8496;--line:#D8DEE7;--sunk:#F1F4F8;--accent:#2350C8;--miss:#B23A2E;--miss-soft:#FBE7E4}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:17px/1.65 Georgia,"Times New Roman",serif}
.wrap{max-width:820px;margin:0 auto;padding:40px 20px 80px}
.docmeta{font:13px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink-3);border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:28px;display:flex;flex-wrap:wrap;gap:6px 18px}
.docmeta b{color:var(--ink-2)}
h1{font-size:34px;line-height:1.2;margin:0 0 10px}
h2{font-size:25px;line-height:1.25;margin:40px 0 10px;padding-top:10px;border-top:1px solid var(--line)}
h3{font-size:19px;margin:24px 0 6px}
p{margin:10px 0}
ul,ol{padding-left:24px}
li{margin:4px 0}
.byline{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink-3)}
.verified{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--sunk);padding:8px 12px;border-radius:6px}
blockquote{margin:14px 0;padding:4px 16px;border-left:3px solid var(--accent);color:var(--ink-2)}
.tw{overflow-x:auto;margin:14px 0}
table{border-collapse:collapse;width:100%;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--sunk)}
mark.miss{background:var(--miss-soft);color:var(--miss);font:12px system-ui,sans-serif;padding:1px 6px;border-radius:4px}
@media print{h2{break-after:avoid}table{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
<div class="docmeta"><span><b>Brief:</b> ${esc(C())} vs UpKeep</span><span><b>Exported:</b> ${today}</span>${filled(s.author)?`<span><b>Author:</b> ${esc(s.author)}</span>`:""}<span><b>Status:</b> ${SECTIONS.filter(x=>x.req&&secState(x)==="done").length}/${SECTIONS.filter(x=>x.req).length} required sections complete</span></div>
<article>
${toHTML(bs,gaps)}
</article>
</div>
</body>
</html>
`;
}
function exportText(){const bs=blocks();if(exportFmt==="md")return toMD(bs);if(exportFmt==="doc")return docHTML($("#gapsChk").checked);return toHTML(bs,false)}
const FMT={md:["Markdown","md","For a CMS or Google Docs. Missing items show as [ADD: …]."],html:["HTML snippet","html","The article body only, to paste into a CMS. Missing items show as [ADD: …]."],doc:["HTML document","html","A complete, styled page with everything filled in so far. Open it in any browser or send it to the client."]};
function openSheet(){$("#sheet").hidden=false;setFmt(exportFmt);$("#closeSheet").focus()}
function setFmt(f){exportFmt=f;
  ["md","html","doc"].forEach(k=>$("#fmt"+(k==="md"?"Md":k==="html"?"Html":"Doc")).classList.toggle("primary",k===f));
  $("#gapsWrap").hidden=f!=="doc";
  $("#sheetText").value=exportText();$("#sheetTitle").textContent=`Export as ${FMT[f][0]}`;$("#sheetHint").textContent=FMT[f][2];
  $("#dlBtn").textContent=`Download .${FMT[f][1]}`}
$("#exportBtn").addEventListener("click",openSheet);
$("#fmtMd").addEventListener("click",()=>setFmt("md"));$("#fmtHtml").addEventListener("click",()=>setFmt("html"));$("#fmtDoc").addEventListener("click",()=>setFmt("doc"));$("#gapsChk").addEventListener("change",()=>setFmt("doc"));
$("#closeSheet").addEventListener("click",()=>{$("#sheet").hidden=true});
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")$("#sheet").hidden=true});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)$("#sheet").hidden=true});
$("#copyBtn").addEventListener("click",async()=>{const t=$("#sheetText");try{await navigator.clipboard.writeText(t.value);toast("Copied")}catch(err){t.focus();t.select();toast("Press Ctrl+C or Cmd+C to copy")}});
$("#dlBtn").addEventListener("click",async()=>{
  const ext=FMT[exportFmt][1];const name=`${slug(C())}-vs-upkeep${exportFmt==="doc"?"":"-draft"}.${ext}`;const data=$("#sheetText").value;
  if(downloads){try{await downloads.save({filename:name,data});toast("Saved")}catch(err){if(err&&err.code==="declined")return;if(err&&err.code==="rate_limited"){toast("A save prompt is already open");return}$("#dlBtn").hidden=true;toast("Download isn't available here. Use Copy instead.")}return}
  if(!window.claude){const url=URL.createObjectURL(new Blob([data],{type:ext==="md"?"text/markdown":"text/html"}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
});

/* ---------- boot ---------- */
function bootLocal(){
  const all=JSON.parse(ls.get("cpb:local")||"{}");list={};for(const id in all)list[id]={competitor:all[id].competitor,updatedAt:all[id].updatedAt};
  const last=ls.get("cpb:last");const id=last&&all[last]?last:Object.keys(all)[0];
  if(id){briefId=id;brief=normalize(all[id]);saved=true}
  fillPicker();render();
}
async function boot(){
  const v=ls.get("cpb:view");if(v==="edit"||v==="preview"||v==="check")view=v;
  store.kind="local";bootLocal();
  setStatus("local",saved?"Kept until you close this tab":"Not saved · clears when you close this tab");
  banner("This brief clears when you close the tab or browser. Use Export to keep a copy.");
  const cl=window.claude;
  if(!cl||!cl.use){$("#dlBtn").hidden=false;return}
  cl.use("comments").then(c=>{comments=c;if(c&&view==="edit")document.querySelectorAll(".cmt").forEach(b=>b.hidden=false)}).catch(()=>{});
  cl.use("downloads").then(d=>{downloads=d;$("#dlBtn").hidden=!d}).catch(()=>{});
}
/* warn before closing a tab that holds work, since closing clears it */
window.addEventListener("beforeunload",e=>{if(dirty||ls.get("cpb:local")){e.preventDefault();e.returnValue=""}});
boot();
})();
